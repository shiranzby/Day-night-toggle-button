<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>主题控件 · 长页面适配</title>
  <script>
    (()=>{let t;try{t=localStorage.getItem('shiran-example-long');}catch(_){}document.documentElement.dataset.theme=t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');})();
  </script>
  <link rel="stylesheet" href="../components/theme-reveal.css"><link rel="stylesheet" href="example.css">
</head>
<body>
  <header><strong>长页面适配示例</strong><button id="menu" aria-expanded="false">目录</button><button id="system">跟随系统</button><theme-button size="1.8" aria-label="切换日夜主题"></theme-button></header>
  <nav class="drawer" data-theme-static inert aria-label="章节目录"></nav>
  <aside class="desktop-outline" aria-label="桌面大纲"></aside>
  <main class="shiran-theme-content" id="content"><h1>长文场景：只在空闲时更新局部缓存</h1><p>本示例生成合成内容，不复制 shydoc 原文；目录保持加载和布局，开关只滑动。</p></main>
  <script type="module" src="long-page.js"></script>
</body>
</html>
